<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云律 · 访问验证</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ec4141'/%3E%3Cstop offset='1' stop-color='%23ff7e5f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M9 18V5l12-2v13' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='6' cy='18' r='3' fill='%23fff'/%3E%3Ccircle cx='18' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(900px 420px at 20% -10%, rgba(236, 65, 65, .2), transparent 60%),
      radial-gradient(700px 380px at 100% 0%, rgba(63, 214, 255, .08), transparent 55%),
      #0e0e13;
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }
  .card {
    width: 380px; max-width: 92vw; padding: 46px 38px 36px;
    background: rgba(22, 22, 29, .9); border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px; box-shadow: 0 24px 70px rgba(0,0,0,.6);
    text-align: center; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .logo {
    width: 68px; height: 68px; margin: 0 auto 20px; border-radius: 18px;
    background: linear-gradient(135deg, #ec4141, #ff7e5f); color: #fff;
    font-size: 30px; line-height: 68px; user-select: none;
    box-shadow: 0 10px 30px rgba(236, 65, 65, .45);
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 25px; color: #f2f2f6; margin-bottom: 10px; letter-spacing: 3px; font-weight: 800; }
  h1 em { font-style: normal; color: #ec4141; }
  .tip { font-size: 13px; color: #9b9bad; margin-bottom: 26px; }
  .err { color: #ff6b6b; font-size: 13px; margin-bottom: 12px; }
  input {
    width: 100%; padding: 13px 16px; font-size: 15px; border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px; outline: none; margin-bottom: 16px; text-align: center;
    background: rgba(30, 30, 39, .9); color: #f2f2f6;
    transition: border-color .2s, box-shadow .2s; letter-spacing: 4px;
  }
  input::placeholder { letter-spacing: 0; color: #6e6e80; }
  input:focus {
    border-color: rgba(236, 65, 65, .55);
    box-shadow: 0 0 0 3px rgba(236, 65, 65, .14);
  }
  button {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ec4141, #ff7e5f); border: none;
    border-radius: 12px; letter-spacing: 4px;
    box-shadow: 0 8px 24px rgba(236, 65, 65, .35);
    transition: transform .15s, box-shadow .25s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(236, 65, 65, .45); }
  .foot { margin-top: 22px; font-size: 12px; color: #6e6e80; }
  .foot svg { vertical-align: -2px; margin-right: 4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <h1>云<em>律</em></h1>
    <p class="tip">朋友的私人音乐库，请输入访问口令</p>
    {% if error %}<p class="err">口令错误，请重试</p>{% endif %}
    <form method="post" action="/gate/verify/">
      {% csrf_token %}
      <input type="password" name="code" placeholder="请输入访问口令" autofocus autocomplete="off">
      <button type="submit">进入音乐库</button>
    </form>
    <div class="foot">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      仅限受邀好友使用
    </div>
  </div>
</body>
</html>
